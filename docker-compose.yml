services:
  postgres:
    image: postgres:17-alpine
    container_name: dniproanimals-postgres
    restart: always
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASS:-postgres}"
      POSTGRES_DB: "${DB_NAME:-dniproanimals}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dniproanimals-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: dniproanimals-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  redis_data:
